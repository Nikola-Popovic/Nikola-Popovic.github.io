ONNECT — One Source of Truth\",\"description\":\"One CRM. One source of truth. Apps that talk to each other. I clean your data, connect your tools, and build a system that reflects reality — not five spreadsheets.\",\"outcomes\":[\"CRM setup and migration\",\"App integrations (your tools, connected)\",\"Data cleanup and consolidation\",\"Process documentation\"]},\"automate\":{\"eyebrow\":\"Tier 2\",\"title\":\"AUTOMATE — Take the Busywork Off Your Plate\",\"description\":\"I build automations that handle email triage, follow-ups, task routing, and data entry — so your team spends time on the calls, decisions, and relationships that actually need a person.\",\"outcomes\":[\"Email categorization and auto-drafts\",\"Lead follow-up sequences\",\"Internal task routing and notifications\",\"Cross-platform data sync\"]},\"augment\":{\"eyebrow\":\"Tier 3\",\"title\":\"AUGMENT — Add Intelligence to the Mix\",\"description\":\"With your systems connected and your processes automated, I layer in AI that handles real work. Calls answered 24/7. Client questions handled instantly. Your team's knowledge, searchable in seconds.\",\"outcomes\":[\"AI receptionist (inbound/outbound, bilingual)\",\"Chat agent trained on your business\",\"Smart search across internal data\",\"AI-assisted reporting and insights\"]}},\"beforeAfter\":{\"title\":\"An ordinary Tuesday\",\"beforeLabel\":\"Before\",\"afterLabel\":\"After\",\"rows\":[{\"before\":\"A call missed during a treatment\",\"after\":\"It's on the list, and the desk knows who to call back\"},{\"before\":\"A 1:30 cancellation, and a scramble to fill it\",\"after\":\"Your waitlist is on and ready to use\"},{\"before\":\"Every appointment goes through the phone\",\"after\":\"Patients can book online\"},{\"before\":\"An improvised voicemail greeting\",\"after\":\"A clear message, in French and English\"},{\"before\":\"Nobody knows who has access to what\",\"after\":\"You know where your information travels\"}]},\"urgency\":{\"header\":\"Two leaks. {{highlight}}\",\"highlight\":\"Calls that get lost. Data you can't see anymore.\"},\"howItWorks\":{\"header\":\"Three steps. {{highlight}}\",\"highlight\":\"We start with what you already pay for.\",\"steps\":[{\"label\":\"REVIEW\",\"title\":\"The Front Desk Review.\",\"subtitle\":\"Free, 30 minutes. What you pay for but don't use, where your calls get lost, and 3 fixes for Monday.\"},{\"label\":\"SETUP\",\"title\":\"The Front Desk Setup.\",\"subtitle\":\"One time, fixed price. I turn on what you already have and write your phone menu and voicemail message.\"},{\"label\":\"PILOT\",\"title\":\"No Call Forgotten.\",\"subtitle\":\"90 days, cancel anytime. A text for the caller, one callback list for your team.\"}]},\"revenueOpportunities\":{\"eyebrow\":\"Free, 30 minutes\",\"title\":\"Your Front Desk Review\",\"subtitle\":\"One page, built from your numbers.\",\"items\":[{\"title\":\"What you already pay for\",\"description\":\"The software features sitting unused.\"},{\"title\":\"Where your calls get lost\",\"description\":\"Your call logs, or a one-week tally at the desk.\"},{\"title\":\"Where your information travels\",\"description\":\"Which tools receive it and who has access.\"}],\"process\":\"You leave with 3 fixes for Monday, even if you never buy anything.\",\"eligibility\":\"For private clinics in Quebec. A short form confirms it's relevant for you.\",\"fineprint\":\"The Review is yours. No patient information is needed.\"},\"whyWorkWithMe\":{\"title\":\"A local developer. Not an agency.\",\"description\":\"Developer and systems architect, bilingual. I work with what your clinic already uses, and you always talk to the same person.\",\"stats\":{\"years\":{\"value\":\"5+\",\"label\":\"Years automating businesses\"},\"projects\":{\"value\":\"20+\",\"label\":\"Companies I've worked with\"},\"timeSaved\":{\"value\":\"0\",\"label\":\"Access to your practice software\"}}},\"cta\":{\"title\":\"Start by seeing what it costs you.\",\"description\":\"30 minutes, free, no pitch. Your Front Desk Review and 3 fixes for Monday, whether we work together or not.\"},\"privacy\":{\"eyebrow\":\"Your data\",\"title\":\"I won't tell you you're compliant.\",\"subtitle\":\"I show you where your data goes and give you the facts for your privacy impact assessment.\",\"doTitle\":\"What I do\",\"do\":[\"The text contains no health information.\",\"A person on your team always makes the callback.\",\"I work without access to your practice software.\",\"Accounts are in your clinic's name, with a written exit plan.\"],\"dontTitle\":\"What I don't do\",\"dont\":[\"I'm not a lawyer and I don't give compliance opinions.\",\"I don't replace your front desk with a robot.\",\"I don't touch your clinical records.\",\"I don't promise numbers your logs don't show.\"]},\"faq\":{\"title\":\"Frequently asked questions\",\"items\":[{\"question\":\"Is a robot answering the phone?\",\"answer\":\"No. Your team answers and calls back. The system only handles the calls that slip through.\"},{\"question\":\"I'm already on Jane or GOrendezvous.\",\"answer\":\"Great, we start there. I look at what your plan includes and what's still turned off. I don't replace your software.\"},{\"question\":\"I use different software.\",\"answer\":\"The Review still works. For the next steps, I check what your software allows first and tell you honestly.\"},{\"question\":\"Will it work with our phone system?\",\"answer\":\"It depends on your provider and system. I check before I propose the pilot.\"},{\"question\":\"Will my team resist?\",\"answer\":\"The front desk is involved from the Review on. Nothing changes in their work until we've looked at it with them.\"},{\"question\":\"What if I want to stop?\",\"answer\":\"You can cancel the pilot anytime. Accounts are in your name and the exit plan is written.\"},{\"question\":\"Are you a lawyer?\",\"answer\":\"No. I document the facts. Your privacy officer or legal advisor decides.\"}]}},\"booking-confirmed\":{\"title\":\"Booki
