énom, nom, courriel et téléphone.\",\"Votre clinique ou entreprise : nom, site web, chiffre d'affaires annuel et taille de l'équipe.\",\"Vos besoins : les sujets choisis et ce que vous écrivez dans le champ libre.\",\"Le moment de l'appel réservé.\",\"Des renseignements techniques envoyés avec le formulaire : langue, adresse de la page et type de navigateur.\"]},{\"title\":\"Pourquoi nous les utilisons\",\"content\":\"Nous utilisons ces renseignements pour :\",\"items\":[\"Répondre à votre demande, préparer votre Bilan et gérer votre appel.\",\"Vous envoyer les messages liés à votre demande.\",\"Protéger le formulaire contre le pourriel.\",\"Mesurer le site et nos publicités, seulement si vous avez accepté les cookies concernés.\"]},{\"title\":\"Décision automatisée\",\"content\":\"Le calendrier de réservation s'affiche selon le chiffre d'affaires annuel que vous indiquez : il ne s'affiche pas sous 100 000 $. Vous recevez alors une réponse par courriel. Vous pouvez nous écrire pour connaître les raisons de ce résultat, faire corriger vos renseignements ou demander qu'une personne revoie votre demande.\",\"items\":[]},{\"title\":\"Fournisseurs qui reçoivent vos renseignements\",\"content\":\"Nous ne vendons pas vos renseignements. Nous les communiquons seulement aux fournisseurs nécessaires au fonctionnement du site et au suivi de votre demande :\",\"items\":[\"n8n, sur notre serveur auto-hébergé : reçoit le formulaire et le conserve dans une table de soumissions.\",\"LeadConnector (GoHighLevel, États-Unis) : gestion des contacts et réservation des appels.\",\"ClickUp (États-Unis) : suivi de votre demande.\",\"Slack (États-Unis) : avis interne avec le résumé de votre demande.\",\"Google (États-Unis) : courriels liés à votre demande.\",\"Cloudflare (États-Unis) : réseau, sécurité du formulaire et mesure de performance du site, sans cookie.\",\"GitHub Pages (États-Unis) : hébergement du site, qui peut traiter votre adresse IP.\",\"Senja (hors du Canada) : affichage des
